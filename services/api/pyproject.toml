[project]
name = "unnamed-api"
version = "0.1.0"
description = "Auth checks, authorization and durable persistence for the Unnamed game. No combat logic."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pgserver>=0.1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
