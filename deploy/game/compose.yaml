# Battle server on its own host. Holds only what it needs: the service key and the API's private address.
name: unnamed-game
services:
  game:
    image: ${GAME_IMAGE:-unnamed-game}
    build:
      context: ../..
      dockerfile: deploy/game.Dockerfile
    environment:
      GAME_API_SERVER_KEY: ${GAME_API_SERVER_KEY:?set GAME_API_SERVER_KEY in deploy/game/.env}
      API_URL: ${API_URL:?set API_URL (the API's private address) in deploy/game/.env}
      GAME_ENV: ${GAME_ENV:-production}
      WORLD_ID: ${WORLD_ID:-}
      ALLOW_GUESTS: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  proxy:
    image: caddy:2.8-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
